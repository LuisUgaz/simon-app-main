name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch: # Permite ejecutar el pipeline manualmente desde la interfaz de GitHub

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Run Linter
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test

  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Simulate Deployment
        run: |
          echo "🚀 Iniciando proceso de despliegue simulado..."
          echo "📦 Empaquetando recursos del proyecto..."
          echo "✨ Subiendo versión a entorno de pruebas..."
          echo "✅ ¡Despliegue completado con éxito!"
